    <!-- Creating hamburger menu -->
    <nav id="nav-hamburger">
        <div id="logo"><a href="/finals/HTML/index.html">Man Xuan</a></div> <!--TOP/TITLE of hamburger menu-->
        <div class="hamburger-menu">
            <!--LIST/LINES in hamburger menu-->
            <div class="hamburger-menuIcon justify-content-between" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <!-- actual LINKS of the LINES in hamburger menu, works w 'toggleMenu()'-->

    <!-- Contacts -->
    <section class="contactContainer" id="contact">
        <h2 class="section_title">Contact Me</h2>

        <div class="contactForm container grid">
            <form action="" class="contactFormContainer">
                <!-- Username input -->
                <div class="contactFormContent">
                    <input type="text" class="input">
                    <!--label-INSIDE-->
                    <label for="">Username</label>
                    <!--label-OUTSIDE-->
                    <span>Username</span>
                </div>
                <!-- Email input -->
                <div class="contactFormContent">
                    <input type="email" class="input">
                    <!--label-INSIDE-->
                    <label for="">Email</label>
                    <!--label-OUTSIDE-->
                    <span>Email</span>
                </div>
                <!-- Message input -->
                <div class="contactFormContent textarea">
                    <textarea name="" id="" class="input"></textarea>
                    <!--label-INSIDE-->
                    <label for="">Message</label>
                    <!--label-OUTSIDE-->
                    <span>Message</span>
                </div>
                <!-- Submit form button -->
                <button type="submit" class="button" onclick="alert('Message sent! Thank you very much! \n ☆*:.｡. o(≧▽≦)o .｡.:*☆')">
                    <i class="uil uil-navigator button-icon"></i>
                    Send Message
                </button>
            </form>
        </div>

        <!-- Icons -->
        <div class="icons">
            <a href="https://github.com/manxuan02?tab=repositories" target="_blank">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/ku-manxuan" target="_blank">

            </a>
        </div>
